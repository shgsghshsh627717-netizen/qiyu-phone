<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>祁煜的手机 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0d16;color:#e8ecf5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#lock{width:100%;max-width:340px;text-align:center}
#lock h1{font-size:19px;font-weight:600;letter-spacing:.5px;margin-bottom:6px}
#lock p{font-size:13px;color:#8b93a7;line-height:1.7;margin-bottom:22px}
#pw{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #2a3040;background:#141826;color:#e8ecf5;font-size:16px;text-align:center;letter-spacing:2px;outline:none}
#pw:focus{border-color:#4f7bcf}
#go{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:0;background:linear-gradient(135deg,#4f7bcf,#2d5aa8);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#go:disabled{opacity:.5}
#msg{margin-top:14px;font-size:13px;min-height:18px;line-height:1.7}
#stage{display:none;width:100%;justify-content:center}
iframe{border:0;width:390px;height:844px;max-height:94vh;border-radius:38px;box-shadow:0 0 50px rgba(79,172,254,.28);background:#000}
.ok{color:#7fd18a}.err{color:#e28b8b}.hint{color:#8b93a7}
</style>
</head>
<body>
<div id="lock">
  <h1>祁煜的手机 2026</h1>
  <p>只有你能打开。<br>把口令输进来。</p>
  <input id="pw" type="password" placeholder="口令" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="go">打开</button>
  <div id="msg"></div>
</div>
<div id="stage"><iframe id="frame" allow="autoplay"></iframe></div>
<script>
const SALT = new Uint8Array([120,20,103,99,99,109,250,161,117,249,75,150,82,74,85,60]);
const enc = new TextEncoder();
const BUST = '?v=' + Date.now();

async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:200000,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
}
async function decryptBlob(key, buf){
  const iv = buf.slice(0,12);
  const tag = buf.slice(buf.byteLength-16);
  const ct = buf.slice(12, buf.byteLength-16);
  const merged = new Uint8Array(ct.byteLength + 16);
  merged.set(new Uint8Array(ct), 0);
  merged.set(new Uint8Array(tag), ct.byteLength);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128}, key, merged);
  return new Blob([plain]);
}
function mimeOf(rel){
  const low=(rel||'').toLowerCase();
  const map={'.mp3':'audio/mpeg','.m4a':'audio/mp4','.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.gif':'image/gif','.webp':'image/webp','.svg':'image/svg+xml','.mp4':'video/mp4','.webm':'video/webm'};
  for(const k in map){ if(low.endsWith(k)) return map[k]; }
  return 'application/octet-stream';
}
async function fetchEnc(key, rel){
  const buf = await (await fetch('enc/'+rel+'.enc'+BUST, {cache:'no-store'})).arrayBuffer();
  const blob = await decryptBlob(key, buf);
  // 给 blob 标上真实 MIME，否则部分浏览器不认它是音频，会卡住或断断续续
  return blob.type ? blob : new Blob([await blob.arrayBuffer()], {type: mimeOf(rel)});
}
function candidates(raw){
  const t = (raw||'').trim();
  const set = [];
  [t, t.replace(/\s+/g,''), t.toLowerCase(), t.replace(/\s+/g,'').toLowerCase()].forEach(x=>{ if(x && !set.includes(x)) set.push(x); });
  return set;
}
async function tryAll(cands){
  let lastErr = null;
  for(const pw of cands){
    try{
      const key = await deriveKey(pw);
      const blob = await fetchEnc(key,'payload.html');
      return {pw, blob};
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('no candidate');
}
async function unlock(raw){
  const msg=document.getElementById('msg'), go=document.getElementById('go');
  go.disabled=true; msg.className='hint'; msg.textContent='在解了…';
  try{
    if(!(window.crypto && crypto.subtle && crypto.subtle.deriveKey)){
      msg.className='err'; msg.textContent='这个浏览器不支持解密（缺 WebCrypto）。请用系统自带浏览器或 Chrome 打开。'; go.disabled=false; return;
    }
    let r;
    try{
      r = await tryAll(candidates(raw));
    }catch(e){
      msg.className='err';
      msg.textContent = '口令还是没对上。（错误：'+(e && e.name ? e.name : 'unknown')+'）你确定没多空格、少字符？';
      go.disabled=false; return;
    }
    const key = await deriveKey(r.pw);
    let html = await r.blob.text();
    const refs=[...new Set([...html.matchAll(/assets\/[^"'()\s]+/g)].map(m=>m[0]))];
    let done=0;
    for(const rel of refs){
      try{
        const blob=await fetchEnc(key,rel);
        const url=URL.createObjectURL(blob);
        html=html.split('"'+rel+'"').join('"'+url+'"');
        html=html.split("'"+rel+"'").join("'"+url+"'");
        html=html.split('url('+rel+')').join('url('+url+')');
      }catch(e){ console.warn('skip',rel,e); }
      done++;
      msg.className='hint'; msg.textContent='在解了… '+done+'/'+refs.length;
    }
    html = html.replace(/preload="none"/g, 'preload="metadata"');
    document.getElementById('lock').style.display='none';
    const stage=document.getElementById('stage'); stage.style.display='flex';
    document.getElementById('frame').srcdoc = html;
  }catch(e){
    msg.className='err'; msg.textContent='出了点问题：'+(e && e.message ? e.message : e); go.disabled=false;
  }
}
document.getElementById('go').addEventListener('click',()=>unlock(document.getElementById('pw').value));
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock(e.target.value);});
// 链接里带了 #口令 就自动填并直接开
if(location.hash.length>1){
  const v = decodeURIComponent(location.hash.slice(1));
  document.getElementById('pw').value = v;
  setTimeout(()=>unlock(v), 300);
}
</script>
</body>
</html>
